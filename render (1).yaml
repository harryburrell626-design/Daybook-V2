# Render "Blueprint": creates the web service. The database lives at Supabase (see README).
services:
  - type: web
    name: daybook
    runtime: node
    plan: free
    buildCommand: node unpack.js && npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_DATABASE_URL
        sync: false
